[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: runs against the real PostgreSQL branch; needs ALLOW_DB_TESTS=1 and -m integration
    concurrency: integration test that COMMITS prefixed data (itest-*) and cleans it up in finally
# Default `pytest -q` skips the integration group. `-m integration` on the command
# line replaces this -m (the last -m wins).
addopts = -m "not integration"
